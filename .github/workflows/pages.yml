name: Publish specification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.22.1'
          cache: npm
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Install dependencies
        run: npm ci
      - name: Read exact editor pin
        id: pins
        run: node -e 'const p=require("./content/environment.json"); console.log("environment="+p.revision+"\nlanguage="+p.distribution)' >> "$GITHUB_OUTPUT"
      - name: Build and check specification
        run: npm run build:pages
      - name: Check out pinned Ink environment
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: siliconjungle/ink-environment
          ref: ${{ steps.pins.outputs.environment }}
          path: .environment-build
      - name: Set up Rust for the browser compiler
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Check out the matching language for linked examples
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: siliconjungle/ink-lang
          ref: ${{ steps.pins.outputs.language }}
          submodules: recursive
          path: .language-check
      - name: Install environment dependencies
        working-directory: .environment-build
        run: npm ci
      - name: Prepare pinned runtime and physical toolchain assets
        working-directory: .environment-build
        run: npm run prepare:assets
      - name: Build browser compiler
        working-directory: .environment-build
        run: npm run build:compiler
      - name: Check the environment
        working-directory: .environment-build
        run: npm test
      - name: Check documentation examples with the pinned browser compiler
        run: |
          cargo build --locked --manifest-path .environment-build/compiler/Cargo.toml --bin ink-browser-check
          cargo build --locked --manifest-path .language-check/Cargo.toml --bin ink
          npm run check:reference -- .environment-build/compiler/target/debug/ink-browser-check .language-check/target/debug/ink
      - name: Compile and execute the pinned JSON flow
        run: |
          .language-check/target/debug/ink build public/documents.ink --target javascript -o dist-pages/json-demo.mjs
          node scripts/check-json.mjs dist-pages/json-demo.mjs
      - name: Build the environment
        working-directory: .environment-build
        run: npm run build
      - name: Install environment on the main site
        run: node scripts/install-environment.mjs .environment-build/dist/app dist-pages/environment
      - name: Upload page
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy page
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
